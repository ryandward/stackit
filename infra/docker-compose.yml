services:
  postgres:
    image: apache/age:release_PG16_1.6.0
    container_name: stackit-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: stackit
      POSTGRES_PASSWORD: stackit
      POSTGRES_DB: stackit
    ports:
      - "54322:5432"
    volumes:
      - stackit-pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackit -d stackit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stackit-pgdata:
